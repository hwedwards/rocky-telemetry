<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1560" viewBox="0 0 2200 1560"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#52708a" stroke-width="2"/></marker><marker id="triangle" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L21 12 L2 22 Z" fill="white" stroke="#52708a" stroke-width="2"/></marker></defs><rect width="2200" height="1560" fill="#f7f9fc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1c3044}.title{font-size:40px;font-weight:700}.sub{font-size:22px;fill:#586e82}.name{font-size:26px;font-weight:700}.stereo{font-size:19px;fill:#53718a}.body{font-size:21px}.small{font-size:19px;fill:#53718a}.label{font-size:20px;fill:#46627b;paint-order:stroke;stroke:#f7f9fc;stroke-width:9px;stroke-linejoin:round}.edge{fill:none;stroke:#52708a;stroke-width:2.6}.section{font-size:18px;font-weight:700;letter-spacing:2px;fill:#61778b}</style>
<text x="60" y="65" class="title" text-anchor="start">Rocky telemetry · dual-core execution</text>
<text x="60" y="105" class="sub" text-anchor="start">Logger’s internal runtime • arrows show work and ownership transfer, not UML inheritance</text>
<rect x="60" y="155" width="1010" height="1020" rx="18" fill="#edf3fb" stroke="#cbd8e6"/><rect x="1130" y="155" width="1010" height="1020" rx="18" fill="#edf6f1" stroke="#cadfd3"/>
<text x="95" y="204" class="section" text-anchor="start">CORE 0 · CONTROL + ACQUISITION</text>
<text x="1165" y="204" class="section" text-anchor="start">CORE 1 · PROCESS + WRITE</text>
