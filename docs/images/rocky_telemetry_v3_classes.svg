<path d="M60 250 H960" stroke="#9aafc2" stroke-width="1.5"/>
<text x="81" y="282" class="body" text-anchor="start">Owns IMU, SdStorage, PassThroughProcessor, Logger,</text>
<text x="81" y="313" class="body" text-anchor="start">Button, StateMachine, and event_queue</text>
<text x="81" y="344" class="body" text-anchor="start">Injects references; dependencies outlive their consumers</text>
<rect x="1050" y="175" width="510" height="200" rx="10" fill="white" stroke="#9aafc2" stroke-width="2"/>
<path d="M1060 175 H1550 Q1560 175 1560 185 V250 H1050 V185 Q1050 175 1060 175" fill="#e7f3ef"/>
