<text x="60" y="65" class="title" text-anchor="start">Rocky telemetry · Logger implements Process</text>
<text x="60" y="105" class="sub" text-anchor="start">Class relationships • selected operations • matches the local refactor branch</text>
<text x="60" y="151" class="section" text-anchor="start">01  OWNERSHIP &amp; DATA CONTRACT</text>
